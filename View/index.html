<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unity 28</title>
</head>
<body>
    <aac-board></aac-board>
    <aac-board-preview></aac-board-preview>
    <div class = "loader-container">
        <!-- <div>Loading</div> -->
        <div class="loader"></div>
    </div>
</body>

<script type = "module">
    import { setup } from "./index.js";
    setup();
</script>

<style>
    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: transparent;
        font-size: 1.3vw;
    }


    aac-board,
    aac-board-preview {
        display: block;
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        right: 0;
        width: 100%;
        height: 100%;
    }
  

    body[loaded] .loader-container,
    body[preview] aac-board,
    body:not([preview]) aac-board-preview,
    body:not([loaded]) aac-board-preview,
    body:not([loaded]) aac-board {
        display: none;
    }

    .loader-container {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
        color: white;
        font-size: 1.5rem;
        font-weight: bold;
        letter-spacing: 0.2em;
    }
    /* 

    .loader {
        width: 25vw;
        height: 3vw;
        border-radius: 20px;
        background:
        repeating-linear-gradient(135deg,#f03355 0 1vw,#ffa516 0 2vw) 0/0%   no-repeat,
        repeating-linear-gradient(135deg,#ddd    0 1vw,#eee    0 2vw) 0/100%;
        animation: l3 2s infinite;
        background-size: calc(var(--p, 0) * 100%) 100%, 100%;
    } */

.loader {
    width: 20vw;
    height: 20vw;
}


.loader::after {
    display: block;
    content: " ";
    height: 100%;
    padding: 2vw;
    aspect-ratio: 1;
    border-radius: 50%;
    background: #ffffff;
    --_m: conic-gradient(#0000 10%,#000),
        linear-gradient(#000 0 0) content-box;

    -webkit-mask: var(--_m);
    mask: var(--_m);
    -webkit-mask-composite: source-out;
    mask-composite: subtract;
    animation: l3 1s infinite linear;
    box-sizing: border-box;
}
@keyframes l3 {to{transform: rotate(1turn)}}
</style>
</html>
